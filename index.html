<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barcode Scanner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📦%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f2f5f9;--card:#fff;--text:#14171a;--muted:#6b7280;--line:#e3e6ea;--accent:#0b6bcb;--on-accent:#fff;--danger:#c0362c;--ok:#1a7f4b;--okbg:#e6f5ec;--warnbg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#0f1215;--card:#191d22;--text:#eceff2;--muted:#9aa3ad;--line:#2a3037;--accent:#5aa2f0;--on-accent:#08111c;--danger:#ff7a6e;--ok:#4cc38a;--okbg:#14301f;--warnbg:#3a1c19}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:46px;height:46px;flex:none;display:flex}
.logo img,.logo svg{width:100%;height:100%;border-radius:12px;object-fit:cover}
header .t{flex:1;min-width:0}
h1{font-size:20px;margin:0;line-height:1.15}
.tagline{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--okbg);color:var(--ok);white-space:nowrap}
.pill.warn{background:var(--warnbg);color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat .n{font-size:26px;font-weight:700;line-height:1.1}
.stat .l{color:var(--muted);font-size:12px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.card.flash{animation:flash .8s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(26,127,75,.55)}100%{box-shadow:0 0 0 16px rgba(26,127,75,0)}}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:11px 14px;cursor:pointer;text-decoration:none;text-align:center}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);flex:1;font-size:17px;padding:14px}
input[type=text],input[type=url]{flex:1;min-width:0;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
#idle{margin-top:12px;border:2px dashed var(--line);border-radius:14px;padding:26px 10px;text-align:center;color:var(--muted)}
#idle b{display:block;font-size:34px}
#reader{margin-top:12px;border-radius:14px;overflow:hidden;background:#000}
#status{margin:10px 0 0;font-size:14px;color:var(--muted);min-height:20px}
#status.err{color:var(--danger)}
.last{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:12px;border-radius:12px;background:var(--bg)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.big{font-size:20px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.head h2{font-size:16px;margin:0}
.item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:12px}
.tag{font-size:13px;font-weight:600;white-space:nowrap}
.tag.ok{color:var(--ok)}.tag.wait{color:var(--danger)}
.empty{color:var(--muted);text-align:center;padding:14px 0}
details summary{cursor:pointer;font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo"></div>
    <div class="t"><h1 id="appName">Barcode Scanner</h1><div class="tagline">Scan → saved to your Google Sheet</div></div>
    <span class="pill" id="pill">Not set up</span>
  </header>

  <div class="stats">
    <div class="stat"><div class="n" id="sTotal">0</div><div class="l">Total scans</div></div>
    <div class="stat"><div class="n" id="sToday">0</div><div class="l">Today</div></div>
    <div class="stat"><div class="n" id="sLast">–</div><div class="l">Last scan</div></div>
  </div>

  <div class="card" id="scanCard">
    <div class="row"><button class="primary" id="toggle">Start camera</button></div>
    <div id="idle"><b>📷</b>Camera is off. Tap “Start camera” to scan.</div>
    <div id="reader" hidden></div>
    <p id="status">Ready.</p>
    <div class="last" id="last" hidden>
      <div style="min-width:0"><div class="lbl">Last scan</div><div class="code big" id="lastCode"></div><div class="meta" id="lastTime"></div></div>
      <div class="tag" id="lastTag"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <input type="text" id="manual" placeholder="Or type a code" autocomplete="off">
      <button id="addBtn">Add</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="photoBtn" style="flex:1">Scan a photo</button>
      <a class="btn" href="dashboard.html" style="flex:1">Open dashboard</a>
      <input type="file" id="file" accept="image/*" capture="environment" hidden>
    </div>
  </div>

  <div class="card">
    <div class="head"><h2>Recent scans</h2><button id="retry" hidden>Retry sending</button></div>
    <div id="list"></div>
  </div>

  <details class="card" id="setup">
    <summary>Setup</summary>
    <p class="meta">Paste the Web app URL from your Apps Script deployment (ends in /exec).</p>
    <div class="row">
      <input type="url" id="url" placeholder="https://script.google.com/macros/s/.../exec">
      <button id="saveUrl">Save &amp; test</button>
    </div>
  </details>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
// ---- Easy customisation ----
const APP_NAME = 'Barcode Scanner'; // shown in the header
const LOGO_URL = '';                // e.g. 'logo.png' (upload the image next to this file). Empty = built-in logo.

const $ = id => document.getElementById(id);
const get = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let url = get('sheetUrl', '');
let log = get('scanLog', []); // {id, code, ts, sent}
let stats = get('scanStats', { total: 0, day: '', today: 0, lastTs: 0 });
if (!stats.total && log.length) { stats.total = log.length; stats.lastTs = log[0].ts; }
const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };

document.title = APP_NAME; $('appName').textContent = APP_NAME;
$('logo').innerHTML = LOGO_URL
  ? '<img alt="" src="' + LOGO_URL.replace(/"/g, '') + '">'
  : '<svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="var(--accent)"/><g fill="var(--on-accent)"><rect x="9" y="12" width="3" height="24" rx="1"/><rect x="14" y="12" width="2" height="24" rx="1"/><rect x="19" y="12" width="4" height="24" rx="1"/><rect x="26" y="12" width="2" height="24" rx="1"/><rect x="30" y="12" width="3" height="24" rx="1"/><rect x="35" y="12" width="4" height="24" rx="1"/></g></svg>';

function setStatus(t, err) { const s = $('status'); s.textContent = t; s.className = err ? 'err' : ''; }
const fmt = t => new Date(t).toLocaleString([], { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });

function render() {
  const pending = log.filter(s => !s.sent).length;
  $('sTotal').textContent = stats.total;
  $('sToday').textContent = stats.day === dayKey(Date.now()) ? stats.today : 0;
  $('sLast').textContent = stats.lastTs ? new Date(stats.lastTs).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '–';
  const pill = $('pill');
  pill.className = 'pill' + (!url || pending ? ' warn' : '');
  pill.textContent = !url ? 'Not set up' : pending ? pending + ' waiting' : '● Connected';
  $('retry').hidden = !pending;

  const top = log[0];
  $('last').hidden = !top;
  if (top) {
    $('lastCode').textContent = top.code; $('lastTime').textContent = fmt(top.ts);
    const t = $('lastTag'); t.className = 'tag ' + (top.sent ? 'ok' : 'wait'); t.textContent = top.sent ? '✓ Saved to sheet' : 'Waiting to send';
  }
  const list = $('list'); list.textContent = '';
  if (!log.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'Nothing scanned yet.'; list.appendChild(d); }
  log.slice(0, 30).forEach(s => {
    const row = document.createElement('div'); row.className = 'item';
    const l = document.createElement('div');
    const c = document.createElement('div'); c.className = 'code'; c.textContent = s.code;
    const m = document.createElement('div'); m.className = 'meta'; m.textContent = fmt(s.ts);
    l.append(c, m);
    const t = document.createElement('div'); t.className = 'tag ' + (s.sent ? 'ok' : 'wait'); t.textContent = s.sent ? '✓ In sheet' : 'Waiting';
    row.append(l, t); list.appendChild(row);
  });
}

let flushing = false;
async function flush() {
  if (flushing || !url) return;
  flushing = true;
  try {
    for (const s of [...log].reverse()) { // oldest first
      if (s.sent) continue;
      const r = await fetch(url, { method: 'POST', body: new URLSearchParams({ barcode: s.code, ts: s.ts, id: s.id }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'Sheet rejected the scan');
      s.sent = true; put('scanLog', log); render();
    }
  } catch (e) {
    setStatus('Saved on this phone, but not sent yet (' + (e.message || 'offline') + '). Will retry.', true);
  }
  flushing = false;
  let n = 0; log = log.filter(s => !s.sent || ++n <= 50); put('scanLog', log); render();
}

function record(code) {
  code = String(code || '').trim();
  if (!code) return;
  if (!url) { setStatus('Open Setup and paste your Web app URL first.', true); $('setup').open = true; return; }
  const now = Date.now(), dk = dayKey(now);
  if (stats.day !== dk) { stats.day = dk; stats.today = 0; }
  stats.total++; stats.today++; stats.lastTs = now; put('scanStats', stats);
  const id = (crypto.randomUUID && crypto.randomUUID()) || now + '-' + Math.random().toString(36).slice(2);
  log.unshift({ id, code, ts: now, sent: false });
  put('scanLog', log); render(); beep(); setStatus('Scanned ' + code);
  const c = $('scanCard'); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
  flush();
}

// ---- scanning ----
let scanner = null, running = false, lastCode = '', lastAt = 0;
function getScanner() {
  if (typeof Html5Qrcode === 'undefined') return null;
  if (!scanner) {
    const F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode('reader', { formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE], useBarCodeDetectorIfSupported: true, verbose: false });
  }
  return scanner;
}
function beep() {
  try { const c = beep.c || (beep.c = new (window.AudioContext || window.webkitAudioContext)()); const o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .08); } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
}
function onScan(text) {
  const now = Date.now();
  if (text === lastCode && now - lastAt < 3000) return; // same code still in view = one scan
  lastCode = text; lastAt = now; record(text);
}
async function start() {
  const s = getScanner();
  if (!s) { setStatus('Scanner library failed to load. Check your connection.', true); return; }
  $('idle').hidden = true; $('reader').hidden = false;
  try {
    await s.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, h) => ({ width: Math.floor(w * .85), height: Math.floor(Math.min(h, w) * .5) }) }, onScan, () => {});
    running = true; $('toggle').textContent = 'Stop camera'; setStatus('Scanning… hold the barcode steady.');
  } catch (e) {
    $('reader').hidden = true; $('idle').hidden = false;
    setStatus('Camera unavailable (' + ((e && e.message) || e) + '). Allow camera access, or use "Scan a photo".', true);
  }
}
async function stop() {
  try { if (scanner && running) await scanner.stop(); } catch (e) {}
  running = false; $('reader').hidden = true; $('idle').hidden = false; $('toggle').textContent = 'Start camera'; setStatus('Camera stopped.');
}
$('toggle').onclick = () => running ? stop() : start();
$('photoBtn').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const s = getScanner(); if (!s) { setStatus('Scanner library failed to load.', true); return; }
  if (running) await stop();
  try { const r = await s.scanFileV2(f, false); record(r.decodedText); }
  catch (err) { setStatus('No barcode found in that photo. Try a closer, sharper shot.', true); }
};
function addManual() { record($('manual').value); $('manual').value = ''; }
$('addBtn').onclick = addManual;
$('manual').addEventListener('keydown', e => { if (e.key === 'Enter') addManual(); });

// ---- setup ----
$('url').value = url;
if (!url) $('setup').open = true;
$('saveUrl').onclick = async () => {
  const u = $('url').value.trim();
  if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)) { setStatus('That doesn\'t look like a Web app URL ending in /exec.', true); return; }
  try {
    const j = await (await fetch(u)).json();
    if (!j.ok) throw new Error();
    url = u; put('sheetUrl', u); setStatus('Connected. Scans will go to your sheet.'); $('setup').open = false; render(); flush();
  } catch (e) { setStatus('Could not reach that URL. Deploy as Web app with access set to "Anyone", then try again.', true); }
};
$('retry').onclick = flush;
window.addEventListener('online', flush);
render(); flush();
</script>
</body>
</html>
